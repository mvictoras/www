<!doctype html>
<html lang="{{ site.Language.Lang | default site.Params.defaultContentLanguage }}">
  {{ partial "head/head.html" . }}
  {{ partial "head/body-class.html" . }}
  <body class="{{ delimit (.Scratch.Get "class" | default (slice)) " " }}">
    {{ partial "header/header.html" . }}
    <div class="container-fluid px-0" role="document">
      {{ block "main" . }}{{ end }}
    </div>
    {{ partial "footer/footer.html" . }}

    {{ block "footer_scripts" . }}
      {{ partial "footer/scripts.html" . }}
    {{ end }}
  </body>
</html>
