<div class="container not-padded">
  <nav class="navbar navbar-expand-xl navbar-dark px-0">
    <a class="navbar-brand px-0" href="{{ "/" | relURL}}">{{ site.Params.title }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto">
        {{ $currentPage := . }}
        {{ range site.Menus.main.ByWeight }}
          <li class="nav-item justify-content-center {{if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }} active{{end}}">
            <a class="nav-link text-nowrap text-uppercase text-center" href="{{ .URL }}" title="{{ .Title }}">{{ .Name }}</a>
          </li>
        {{ end }}
      </ul>
      <div class="dropdown-divider"></div>
      <ul class="navbar-nav nav-flex-icons justify-content-center">
        {{ range site.Data.social }}
        <li class="nav-item"><a class="nav-link px-2" href="{{ .url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ .name }}"><i class="fa-brands fa-{{ .name }}"></i></a></li>
        {{ end }}
      </ul>
      <div class="dropdown-divider"></div>
    </div>
  </nav>
  <script>
  (function(){
    var nav = document.querySelector('.navbar');
    if (!nav) return;
    window.addEventListener('scroll', function(){
      if (window.scrollY > 50) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    });
  })();
  </script>
</div>
